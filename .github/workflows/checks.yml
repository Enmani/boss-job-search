name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix ./plugin --no-fund --no-audit
      - name: Check
        run: npm run precheck
